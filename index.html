<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayFlow | Smart Planner</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 60px;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 10%;
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav ul a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav ul a:hover, nav ul a.active {
            color: var(--accent);
        }

        /* Main Layout */
        .container {
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1rem;
        }

        .header-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header-section h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .header-section p {
            color: var(--text-muted);
        }

        /* Planner Form */
        .planner-card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }

        .form-group {
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 1rem;
            align-items: end;
        }

        @media (max-width: 600px) {
            .form-group {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Schedule List */
        .schedule-title {
            margin-bottom: 1rem;
            font-size: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clock-display {
            font-family: monospace;
            color: var(--accent);
            font-size: 1.1rem;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .task-item {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent);
            animation: fadeIn 0.3s ease;
        }

        .task-item.passed {
            border-left-color: var(--text-muted);
            opacity: 0.6;
        }

        .task-info h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .task-info span {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .delete-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
            border: 2px dashed #334155;
            border-radius: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Dayflow</div>
        <ul>
            <li><a href="index.html" class="active">Planner</a></li>
            <li><a href="about us.html">About Us</a></li>
            <li><a href="contact us.html">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Master Your Day</h1>
            <p>Input your tasks, and let DayFlow arrange your schedule with real-time smart reminders.</p>
        </div>

        <div class="planner-card">
            <form id="todo-form" class="form-group">
                <div>
                    <label for="task-name">What are you planning?</label>
                    <input type="text" id="task-name" placeholder="e.g., Gym, Team Meeting, Coding" required>
                </div>
                <div>
                    <label for="task-time">At what time?</label>
                    <input type="time" id="task-time" required>
                </div>
                <button type="submit">Add Task</button>
            </form>
        </div>

        <div class="schedule-title">
            <h2>Your Timeline</h2>
            <div class="clock-display" id="live-clock">00:00:00</div>
        </div>

        <div id="task-list-container" class="task-list">
            <div class="empty-state">No activities planned yet. Fill the form above to start your day!</div>
        </div>
    </div>

    <script>
        let tasks = JSON.parse(localStorage.getItem('dayflow_tasks')) || [];

        const todoForm = document.getElementById('todo-form');
        const taskNameInput = document.getElementById('task-name');
        const taskTimeInput = document.getElementById('task-time');
        const taskListContainer = document.getElementById('task-list-container');
        const liveClock = document.getElementById('live-clock');

        // Play synthetic alarm sound without needing audio files
        function triggerBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Loop 3 quick beeps
            for(let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(audioCtx.currentTime + 0.15);
                }, i * 300);
            }
        }

        // Render tasks sorted by time
        function renderTasks() {
            // Sort chronologically by time string "HH:MM"
            tasks.sort((a, b) => a.time.localeCompare(b.time));
            localStorage.setItem('dayflow_tasks', JSON.stringify(tasks));

            if (tasks.length === 0) {
                taskListContainer.innerHTML = `<div class="empty-state">No activities planned yet. Fill the form above to start your day!</div>`;
                return;
            }

            const now = new Date();
            const currentHourMin = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            taskListContainer.innerHTML = tasks.map((task, index) => {
                const isPassed = task.time < currentHourMin;
                return `
                    <div class="task-item ${isPassed ? 'passed' : ''}">
                        <div class="task-info">
                            <h3>${task.name}</h3>
                            <span>⏰ ${task.time}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${index})">Remove</button>
                    </div>
                `;
            }).join('');
        }

        // Add Task
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTask = {
                name: taskNameInput.value,
                time: taskTimeInput.value,
                alarmed: false
            };
            tasks.push(newTask);
            renderTasks();
            todoForm.reset();
        });

        // Delete Task
        window.deleteTask = (index) => {
            tasks.splice(index, 1);
            renderTasks();
        };

        // Real-time Clock and Alarm checker loop
        function checkTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            liveClock.textContent = timeString;

            const currentHourMin = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            let updated = false;

            tasks.forEach(task => {
                if (task.time === currentHourMin && !task.alarmed) {
                    task.alarmed = true;
                    updated = true;
                    triggerBeep();
                    // Brief delay to allow audio context to initialize if needed
                    setTimeout(() => {
                        alert(`⏰ ALARM: It's time for "${task.name}"!`);
                    }, 50);
                }
            });

            if (updated) {
                renderTasks();
            }
        }

        // Initialize
        renderTasks();
        setInterval(checkTime, 1000);
    </script>
</body>
</html>
